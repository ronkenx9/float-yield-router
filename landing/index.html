<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/flo-mark.png" />
    <link rel="apple-touch-icon" href="/flo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <!-- Preload the hero video so it starts streaming before React mounts -->
    <link rel="preload" as="video" href="/flo-hero.mp4" type="video/mp4" />

    <title>FLOAT — Earn Arc trading fees without managing LPs</title>
    <meta name="description" content="Choose your risk and put USDC to work in Arc liquidity pools. Flo handles pool selection, price ranges, rebalancing and fee collection. Product preview." />

    <!-- Open Graph (Facebook, LinkedIn, Discord, Slack, iMessage…)
         NOTE: og:image MUST be an absolute URL. Most scrapers (X, Discord,
         iMessage) won't resolve relative paths and render a broken-image
         placeholder when you give them /og.png alone. -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://float-yield-router.vercel.app/" />
    <meta property="og:title"       content="Earn trading fees. Skip the LP work." />
    <meta property="og:description" content="Choose your risk. Flo manages pools, ranges, rebalancing and fee collection on Arc. Product preview; capital at risk." />
    <meta property="og:image"       content="https://float-yield-router.vercel.app/flo-calm.webp" />
    <meta property="og:image:width"  content="852" />
    <meta property="og:image:height" content="1068" />
    <meta property="og:image:alt"    content="Flo, the FLOAT liquidity-agent mascot" />
    <meta property="og:site_name"   content="FLOAT" />

    <!-- Twitter / X large-image card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@floatrouter" />
    <meta name="twitter:creator"     content="@floatrouter" />
    <meta name="twitter:title"       content="Earn trading fees. Skip the LP work." />
    <meta name="twitter:description" content="Add USDC, choose your risk, and let Flo manage the liquidity position on Arc. Product preview; capital at risk." />
    <meta name="twitter:image"       content="https://float-yield-router.vercel.app/flo-calm.webp" />
  </head>
  <body class="bg-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
